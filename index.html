<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12191c"><title>Cabina · Flujos A320</title><link rel="icon" href="assets/cabina.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"><script defer src="engine.js"></script><script defer src="app.js"></script></head><body>
<header class="top"><div class="brand"><img src="assets/cabina.svg" width="39" height="39" alt=""><b>Cabina</b></div><span class="divider"></span><nav aria-label="Modo"><button data-nav="edit" class="active"><i data-i="route"></i>Editor</button><button data-nav="practice"><i data-i="play"></i>Práctica</button></nav><button class="vault" id="vault"><i data-i="layers"></i>Mis flujos</button></header>
